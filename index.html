<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏幕直播 - 接收端</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; background:#0f1117; color:#e5e7eb; min-height:100vh; padding:20px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  h1 { font-size:1.4rem; } h1 span { color:#667eea; }
  #status { font-size:.85rem; padding:6px 12px; border-radius:20px; background:#374151; }
  #status.on { background:#064e3b; color:#6ee7b7; }
  #status.live { background:#7f1d1d; color:#fca5a5; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.6; } }
  #videoArea { width:100%; background:#000; border-radius:12px; display:flex; align-items:center; justify-content:center; min-height:300px; overflow:hidden; }
  #liveVideo { width:100%; max-height:70vh; display:none; }
  #placeholder { color:#6b7280; padding:80px 20px; text-align:center; }
  #placeholder .big { font-size:3rem; margin-bottom:10px; }
  .muted { color:#6b7280; font-size:.85rem; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>📺 <span>屏幕直播 - 接收端</span></h1>
  <div id="status" class="on">● 已连接服务器，等待直播</div>
</header>

<div id="videoArea">
  <div id="placeholder">
    <div class="big">📡</div>
    <div>暂无直播画面</div>
    <div class="muted">请在另一台设备/页面打开 sender.html 开始屏幕共享</div>
  </div>
  <video id="liveVideo" autoplay muted playsinline></video>
</div>

<script>
const statusEl = document.getElementById('status');
const placeholder = document.getElementById('placeholder');
const video = document.getElementById('liveVideo');

function setStatus(cls, text) {
  statusEl.className = cls;
  statusEl.textContent = '● ' + text;
}

let ws, mediaSource, sourceBuffer, mime, queue = [], started = false, retryTimer;

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    setStatus('on', '已连接服务器，等待直播');
    ws.send(JSON.stringify({ type: 'viewer' }));
  };
  ws.onclose = () => {
    setStatus('on', '连接断开，2s 后重连');
    started = false;
    resetMSE();
    retryTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = onMessage;
}
connect();

function onMessage(e) {
  if (typeof e.data === 'string') {
    const msg = JSON.parse(e.data);
    if (msg.type === 'mime') { mime = msg.mime; ws.send(JSON.stringify({ type: 'viewer-ready' })); }
    else if (msg.type === 'stream-start') beginStream();
    else if (msg.type === 'sender-online') { mime = msg.mime; ws.send(JSON.stringify({ type: 'viewer-ready' })); beginStream(); }
    else if (msg.type === 'stream-end') {
      setStatus('on', '直播已结束，等待下一场');
      started = false;
      resetMSE();
    }
    return;
  }
  // 二进制：视频分片
  if (!started) beginStream();
  if (mediaSource && mediaSource.readyState === 'open') {
    if (sourceBuffer.updating || queue.length > 0) {
      queue.push(e.data);
      if (queue.length > 30) { queue.shift(); mediaSource.setTimestampOffset && 0; } // 防积压
    } else {
      sourceBuffer.appendBuffer(e.data);
    }
  }
}

function beginStream() {
  if (started) return;
  started = true;
  resetMSE();
  mediaSource = new MediaSource();
  video.src = URL.createObjectURL(mediaSource);
  video.style.display = 'block';
  placeholder.style.display = 'none';
  mediaSource.addEventListener('sourceopen', () => {
    try {
      sourceBuffer = mediaSource.addSourceBuffer(mime || 'video/webm;codecs="vp8,opus"');
      sourceBuffer.mode = 'segments';
      sourceBuffer.addEventListener('updateend', pump);
      sourceBuffer.addEventListener('error', (e) => console.error('SB error', e));
    } catch (err) {
      console.error('addSourceBuffer 失败', err);
      setStatus('on', '浏览器不支持该编码: ' + mime);
    }
  });
  setStatus('live', '正在观看直播');
}

function pump() {
  if (!sourceBuffer || sourceBuffer.updating || queue.length === 0) return;
  try { sourceBuffer.appendBuffer(queue.shift()); } catch (e) { console.warn(e); }
}

function resetMSE() {
  queue = [];
  if (mediaSource && mediaSource.readyState === 'open') {
    try { mediaSource.endOfStream(); } catch (e) {}
  }
  mediaSource = null;
  sourceBuffer = null;
  video.style.display = 'none';
  placeholder.style.display = 'block';
}

// 低延迟：追上播放头时轻微加速
setInterval(() => {
  if (video.buffered.length && video.readyState >= 2) {
    const end = video.buffered.end(video.buffered.length - 1);
    if (end - video.currentTime > 2) video.currentTime = end - 1;
  }
}, 1000);
</script>
</body>
</html>
